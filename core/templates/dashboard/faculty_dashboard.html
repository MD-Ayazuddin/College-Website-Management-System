<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - TIIT</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .tiit-page-wrapper { max-width: 800px; margin: 40px auto; padding: 0 15px; }
        .tiit-card {
            background-color: #ffffff; padding: 30px; border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 4px solid #1a3c4b; /* फैकल्टी के लिए डार्क ब्लू बॉर्डर */
        }
        .dashboard-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; margin-top: 25px;
        }
        .grid-item {
            background: #f8f9fa; padding: 20px; border-radius: 6px; 
            border: 1px solid #e1e8e5; text-align: left;
        }
        .logout-btn {
            background-color: #d9534f; color: white; padding: 10px 20px; 
            text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block;
        }
        .logout-btn:hover { background-color: #c9302c; }
    </style>
</head>
<body>

<div class="tiit-page-wrapper">
    <div class="tiit-card">
        
        <h2 style="color: #1a3c4b; margin-top: 0;">Welcome, Faculty {{ request.user.username|title }}! 🎓</h2>
        <p style="color: #555; font-size: 16px;">This is your secure Faculty Control Panel.</p>
        
        <hr style="border: none; border-top: 1px solid #eaeaea; margin: 20px 0;">

        <div class="dashboard-grid">
            
            <div class="grid-item">
                <h3 style="color: #1a3c4b; margin: 0 0 10px 0;">Student Records</h3>
                <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Access complete list of enrolled students and their details.</p>
                <a href="#" target="_blank" style="color: #0056b3; font-size: 15px; text-decoration: underline; font-weight: 500;">View All Students ↗</a>
            </div>

            <div class="grid-item">
                <h3 style="color: #1a3c4b; margin: 0 0 10px 0;">Manage Results</h3>
                <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Upload or update semester grades for students.</p>
                <a href="#" target="_blank" style="color: #0056b3; font-size: 15px; text-decoration: underline; font-weight: 500;">Upload Marks ↗</a>
            </div>

        </div>

        <div style="text-align: right;">
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        </div>

    </div>
</div>

</body>
</html>
